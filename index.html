<html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">

    <section id="mapScreen" class="screen">

      <div id="mapArea">
        <img id="worldMap" src="./world_map.jpg" alt="World map">

        <button
          id="GeorgiaTap"
          class="mapPin"
          aria-label="Georgia"
          style="top:40%; left:26%;">
        </button>

        <button
          id="VietnamTap"
          class="mapPin"
          aria-label="Vietnam"
          style="top:50%; left:30%;">
        </button>

        <button
          id="ContactTap"
          class="mapPlane"
          aria-label="Contact Me"
          style="top:50%; left:20%;">
        </button>


      </div>

    </section>

    <section id="storyScreen" class="screen">

        <button id="backButton">← Back</button>


        <article id="GeorgiaStory" class="story">
            <h1>Georgia</h1>

            <p>My Georgia story starts here...</p>

            <img src="images/georgia1.jpg" alt="Georgia memory">

            <p>
            Another part of my story...
            </p>
        </article>


        <article id="VietnamStory" class="story">
            <h1>Vietnam</h1>

            <p>
            This is where my Vietnam story starts...
            </p>

            <img src="images/vietnam1.jpg" alt="Vietnam memory">

            <p>
            Another part of the story...
            </p>
        </article>
        

    </section>

    <section id="contactScreen">

        <button id="closeContact">
            ↓ Back
        </button>

        <div class="contactContent">

            <h1>Contact Me</h1>

            <p>
            Want to talk, collaborate, or build something together?
            </p>

            <a href="mailto:your@email.com">
            your@email.com
            </a>

        </div>

    </section>



  </div>

  <script src="script.js"></script>

</body>



</html>
